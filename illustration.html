<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean Lindholm's Illustrations</title>

    <link rel="stylesheet" href="stylesandstuff.css">
</head>
<body>
    <nav class="header-bar" aria-label="Main navigation">
        <a class="header-brand" href="index.html" aria-label="Home">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 2.5 11h2v9h6v-6h3v6h6v-9h2L12 3Z"/>
            </svg>
        </a>

        <div class="nav-links">
            <a href="#">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <header>
        <div class="title-block">
            <p class="title-name">Sean Lindholm's</p>
            <h1>Illustrations</h1>
        </div>
    </header>

    <main id="artwork-gallery">
        <div class="artwork" role="button" tabindex="0" data-paper="5x7" data-orientation="landscape"
             style="--paper-texture: url('Paper Textures/optimized/5x7-landscape/5x7.1.png')"
             data-project="Clayface"
             data-image="Clayface.jpg">
            <img src="thumbnails/Clayface-thumb.jpg" alt="Illustration of Clayface" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="comic"
             style="--paper-texture: url('Paper Textures/optimized/Comic/Comic1.png')"
             data-project="Absolute Flash"
             data-image="Absolute Flash.JPG">
            <img src="thumbnails/Absolute Flash-thumb.jpg" alt="Illustration of Absolute Flash" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="5x7"
             style="--paper-texture: url('Paper Textures/optimized/5x7/5x7.2.png')"
             data-project="Brand New Day"
             data-image="Brand New Day.JPG">
            <img src="thumbnails/Brand New Day-thumb.jpg" alt="Illustration titled Brand New Day" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="comic"
             style="--paper-texture: url('Paper Textures/optimized/Comic/Comic2.png')"
             data-project="Absolute Wonder Woman"
             data-image="Absolute Wonder Woman.JPG">
            <img src="thumbnails/Absolute Wonder Woman-thumb.jpg" alt="Illustration of Absolute Wonder Woman" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="5x7"
             style="--paper-texture: url('Paper Textures/optimized/5x7/5x7.3.png')"
             data-project="Berserk"
             data-image="Berserk.jpg">
            <img src="thumbnails/Berserk-thumb.jpg" alt="Illustration of Berserk" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="square"
             style="--paper-texture: url('Paper Textures/optimized/Square/1x1.1.png')"
             data-project="Luffy VS Trump"
             data-image="One_Piece _America_Arc.jpg">
            <img src="thumbnails/One_Piece _America_Arc-thumb.jpg" alt="Illustration of Luffy and Trump" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="5x7"
             style="--paper-texture: url('Paper Textures/optimized/5x7/5x7.1.png')"
             data-project="They Are Watching"
             data-image="TheyAreWatching.jpg">
            <img src="thumbnails/TheyAreWatching-thumb.jpg" alt="Illustration titled They Are Watching" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="5x7" data-orientation="landscape"
             style="--paper-texture: url('Paper Textures/optimized/5x7-landscape/5x7.2.png')"
             data-project="Iron Man: Mark 1"
             data-image="Mark_I.jpg">
            <img src="thumbnails/Mark_I-thumb.jpg" alt="Illustration titled Iron Man: Mark 1" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="5x7"
             style="--paper-texture: url('Paper Textures/optimized/5x7/5x7.3.png')"
             data-project="Fun in the Sun"
             data-image="Fun_In_The_Sun.jpg">
            <img src="thumbnails/Fun_In_The_Sun-thumb.jpg" alt="Illustration titled Fun in the Sun" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="5x7" data-orientation="landscape"
             style="--paper-texture: url('Paper Textures/optimized/5x7-landscape/5x7.1.png')"
             data-project="Jungle Zoro Redraw"
             data-image="Jungle_Zoro_Redraw.jpg">
            <img src="thumbnails/Jungle_Zoro_Redraw-thumb.jpg" alt="Illustration titled Jungle Zoro Redraw" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="5x7"
             style="--paper-texture: url('Paper Textures/optimized/5x7/5x7.2.png')"
             data-project="Rest Your Eyes"
             data-image="Rest_Your_Eyes.jpg">
            <img src="thumbnails/Rest_Your_Eyes-thumb.jpg" alt="Illustration titled Rest Your Eyes" loading="lazy" decoding="async">
        </div>

        <div class="artwork" role="button" tabindex="0" data-paper="square"
             style="--paper-texture: url('Paper Textures/optimized/Square/1x1.2.png')"
             data-project="Rockstar"
             data-image="Rockstar.jpg">
            <img src="thumbnails/Rockstar-thumb.jpg" alt="Illustration titled Rockstar" loading="lazy" decoding="async">
        </div>
    </main>

    <dialog class="project-dialog" id="project-dialog" aria-labelledby="dialog-title">
        <div class="dialog-layout">
            <div class="dialog-image">
                <img id="dialog-artwork" src="" alt="Selected project artwork">

                <div class="zoom-controls" aria-label="Image zoom controls">
                    <input id="zoom-slider" type="range" min="100" max="300" value="100" step="5" aria-label="Zoom level">
                    <span id="zoom-label">100%</span>
                </div>
            </div>

            <aside class="artist-panel">
                <button class="close-dialog" type="button" aria-label="Close project">Close</button>
                <h2 id="dialog-title"></h2>
                <p class="artwork-details">Illustration | 2026</p>
                <p id="dialog-statement"></p>
                <div class="dialog-navigation" aria-label="Artwork navigation">
                    <button id="previous-artwork" type="button" aria-label="Previous illustration">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M15 18l-6-6 6-6"></path>
                        </svg>
                    </button>
                    <button id="next-artwork" type="button" aria-label="Next illustration">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 18l6-6-6-6"></path>
                        </svg>
                    </button>
                </div>
            </aside>
        </div>
    </dialog>

    <footer>
        <div class="footer-grid">
            <p><span class="footer-label">Updated</span>November 24th, 2026</p>
            <p><span class="footer-label">Designer</span>Sean Lindholm</p>
            <p><span class="footer-label">Contact</span>seanlindholm101@gmail.com</p>
        </div>
    </footer>

    <script src="stylesandstuff.js"></script>
</body>
</html>
