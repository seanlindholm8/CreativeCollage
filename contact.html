<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sean Lindholm</title>

    <style>
        @font-face {
            font-family: 'Comix Loud';
            src: url('Fonts/Comix Loud.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 12px clamp(24px, 6vw, 96px);
            position: relative;
            isolation: isolate;
            background: linear-gradient(to bottom, #F9A03F 0%, #F1D302 25%, #F1D302 75%, #F9A03F 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: url("cardboard-texture.jpg") center top / cover no-repeat;
            mix-blend-mode: soft-light;
            filter: brightness(0.9) contrast(2.4);
            opacity: 0.55;
            pointer-events: none;
        }

        @media (min-width: 901px) {
            body::before {
                position: fixed;
            }
        }

        h1,
        h2 {
            font-family: 'Comix Loud', Arial, Helvetica, sans-serif;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.25rem, 3.5vw, 2.5rem);
        }

        h2 {
            margin: 0 0 16px;
            font-size: clamp(1rem, 1.8vw, 1.4rem);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 0;
            border-bottom: 2px solid rgba(0, 0, 0, 0.7);
        }

        .header-bar a {
            color: black;
            text-decoration: none;
        }

        .header-brand {
            font-family: 'Comix Loud', Arial, Helvetica, sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            padding: 8px 12px;
            border: 2px solid transparent;
        }

        .nav-links a:hover {
            border-color: black;
        }

        .nav-links a:focus {
            border-color: transparent;
        }

        .header-bar a:focus-visible,
        .message-link:focus-visible,
        .slide-controls button:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }

        header {
            min-height: clamp(180px, 30vh, 320px);
            margin: clamp(20px, 5vw, 70px) calc(50% - 50vw) clamp(30px, 5vw, 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        .message-section {
            padding: clamp(22px, 4vw, 40px);
            border: 2px solid rgba(0, 0, 0, 0.75);
            background: rgba(255, 247, 214, 0.86);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.28);
        }

        .message-section {
            margin-bottom: clamp(24px, 4vw, 40px);
            text-align: center;
        }

        .message-section p {
            margin: 0 0 20px;
            line-height: 1.6;
        }

        .message-link {
            display: inline-block;
            padding: 12px 20px;
            border: 2px solid black;
            background: #F1D302;
            color: black;
            font-weight: 700;
            text-decoration: none;
        }

        .message-link:hover {
            background: #F9A03F;
        }

        .contact-detail {
            display: block;
            margin-top: 14px;
            color: black;
        }

        footer {
            min-height: clamp(180px, 25vh, 280px);
            margin: clamp(20px, 5vw, 70px) calc(50% - 50vw) clamp(30px, 5vw, 65px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.75rem, 2vw, 1rem);
        }

        .footer-grid {
            width: min(1200px, calc(100% - 48px));
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: clamp(16px, 4vw, 48px);
            padding-top: 24px;
            border-top: 2px solid black;
        }

        .footer-grid p {
            margin: 0;
        }

        .footer-grid p:last-child {
            text-align: right;
        }

        .footer-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .header-bar {
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 12px;
                padding: 12px 0;
            }

            .nav-links {
                width: 100%;
                justify-content: space-between;
                gap: 4px;
            }

            .nav-links a {
                flex: 1;
                padding: 8px 4px;
                text-align: center;
            }

            .footer-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .footer-grid p,
            .footer-grid p:last-child {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <nav class="header-bar" aria-label="Main navigation">
        <a class="header-brand" href="index.html">Sean Lindholm</a>

        <div class="nav-links">
            <a href="#">About</a>
            <a href="contact.html" aria-current="page">Contact</a>
        </div>
    </nav>

    <header>
        <h1>Contact</h1>
    </header>

    <main>
        <section class="message-section" aria-labelledby="message-heading">
            <h2 id="message-heading">Send a Message</h2>
            <p>Have a commission idea or a question? Email me and we can talk about it.</p>
            <a class="message-link" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=seanlindholm101%40gmail.com&amp;su=Commission%20Inquiry" target="_blank" rel="noopener noreferrer">Email Me</a>
            <a class="contact-detail" href="https://www.instagram.com/seanlindholm_creative/" target="_blank" rel="noopener noreferrer">@seanlindholm_creative</a>
        </section>

    </main>

    <footer>
        <div class="footer-grid">
            <p><span class="footer-label">Updated</span>November 24th, 2026</p>
            <p><span class="footer-label">Designer</span>Sean Lindholm</p>
            <p><span class="footer-label">Contact</span>seanlindholm101@gmail.com</p>
        </div>
    </footer>
</body>
</html>
