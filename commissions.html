<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commissions | Sean Lindholm</title>

    <style>
        @font-face {
            font-family: 'Comix Loud';
            src: url('../Fonts/Comix Loud.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 12px clamp(24px, 6vw, 96px);
            position: relative;
            isolation: isolate;
            background: linear-gradient(to bottom, #F9A03F 0%, #F1D302 25%, #F1D302 75%, #F9A03F 100%);
            font-family: Arial, Helvetica, sans-serif;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            background: url("cardboard-texture.jpg") center top / cover no-repeat;
            mix-blend-mode: soft-light;
            filter: brightness(0.9) contrast(2.4);
            opacity: 0.55;
            pointer-events: none;
        }

        @media (min-width: 901px) {
            body::before {
                position: fixed;
            }
        }

        h1,
        h2 {
            margin: 0;
            font-family: 'Comix Loud', Arial, Helvetica, sans-serif;
            font-weight: 900;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(1.25rem, 3.5vw, 2.5rem);
        }

        h2 {
            font-size: clamp(1rem, 1.8vw, 1.4rem);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 0;
            border-bottom: 2px solid rgba(0, 0, 0, 0.7);
        }

        .header-bar a {
            color: black;
            text-decoration: none;
        }

        .header-brand {
            font-family: 'Comix Loud', Arial, Helvetica, sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: clamp(0.9rem, 1.5vw, 1.1rem);
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            padding: 8px 12px;
            border: 2px solid transparent;
        }

        .nav-links a:hover {
            border-color: black;
        }

        .header-bar a:focus-visible,
        .slide-controls button:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }

        header {
            min-height: clamp(180px, 30vh, 320px);
            margin: clamp(20px, 5vw, 70px) calc(50% - 50vw) clamp(30px, 5vw, 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        main {
            max-width: 1000px;
            margin: 0 auto;
        }

        .commission-section {
            width: 100%;
        }

        .commission-section h2 {
            margin-bottom: 16px;
            text-align: center;
        }

        .commission-section + .commission-section {
            margin-top: clamp(36px, 6vw, 72px);
        }

        .commission-intro {
            margin: 0 0 20px;
            line-height: 1.6;
            text-align: center;
        }

        .category-card {
            width: min(100%, 302px);
            min-height: 92px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid rgba(0, 0, 0, 0.8);
            background: rgba(255, 255, 255, 0.12);
            color: black;
            text-decoration: none;
            font-family: 'Comix Loud', Arial, Helvetica, sans-serif;
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.75);
            transition: transform 100ms ease-out, box-shadow 100ms ease-out, background-color 100ms ease-out;
        }

        .category-card:hover,
        .category-card:focus-visible {
            background: rgba(255, 255, 255, 0.28);
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.75);
        }

        .category-card:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }

        .slideshow {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
        }

        .slide-frame {
            margin: 0;
        }

        .slide-frame img {
            display: block;
            width: 100%;
            height: clamp(280px, 50vw, 520px);
            object-fit: contain;
        }

        .slide-controls button {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            padding: 0;
            border: 2px solid rgba(0, 0, 0, 0.72);
            border-radius: 12px;
            background: transparent;
            color: black;
            cursor: pointer;
            transition: background 160ms ease, color 160ms ease, transform 160ms ease;
        }

        .slide-controls button:hover,
        .slide-controls button:focus-visible {
            background: rgba(0, 0, 0, 0.12);
            transform: translateY(-2px);
        }

        .slide-controls button:focus-visible {
            outline: 3px solid #f1d302;
            outline-offset: 3px;
        }

        .slide-controls svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.25;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .slide-count {
            margin: 14px 0 0;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        footer {
            min-height: clamp(180px, 25vh, 280px);
            margin: clamp(20px, 5vw, 70px) calc(50% - 50vw) clamp(30px, 5vw, 65px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: clamp(0.75rem, 2vw, 1rem);
        }

        .footer-grid {
            width: min(1200px, calc(100% - 48px));
            display: grid;
            grid-template-columns: 1fr 1fr 1.5fr;
            gap: clamp(16px, 4vw, 48px);
            padding-top: 24px;
            border-top: 2px solid black;
        }

        .footer-grid p {
            margin: 0;
        }

        .footer-grid p:last-child {
            text-align: right;
        }

        .footer-label {
            display: block;
            margin-bottom: 6px;
            font-weight: 900;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .header-bar {
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 12px;
                padding: 12px 0;
            }

            .nav-links {
                width: 100%;
                justify-content: space-between;
                gap: 4px;
            }

            .nav-links a {
                flex: 1;
                padding: 8px 4px;
                text-align: center;
            }

            .slideshow {
                grid-template-columns: 1fr 1fr;
            }

            .slide-frame {
                grid-column: 1 / -1;
                grid-row: 1;
            }

            .slide-frame img {
                height: 55vh;
            }

            .footer-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }

            .footer-grid p,
            .footer-grid p:last-child {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <nav class="header-bar" aria-label="Main navigation">
        <a class="header-brand" href="creativecollage.html">Sean Lindholm</a>

        <div class="nav-links">
            <a href="#">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <header>
        <h1>Commissions</h1>
    </header>

    <main>
        <section class="commission-section" aria-labelledby="details-heading">
            <h2 id="details-heading">Details</h2>
            <p class="commission-intro">Info and pricing for ordering commissions.</p>

            <div class="slideshow" role="region" aria-roledescription="carousel" aria-label="Commission detail examples">
                <div class="slide-controls">
                    <button id="previous-detail" type="button" aria-label="Previous detail">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M15 18l-6-6 6-6"></path>
                        </svg>
                    </button>
                </div>

                <figure class="slide-frame">
                    <img id="detail-slide" src="Commission details/Request.PNG" alt="Commission request">
                </figure>

                <div class="slide-controls">
                    <button id="next-detail" type="button" aria-label="Next detail">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 18l6-6-6-6"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <p class="slide-count" id="detail-count" aria-live="polite">1 of 7</p>
        </section>

        <section class="commission-section" aria-label="More portfolio work">
            <a class="category-card" href="illustration.html">Illustration</a>
        </section>
    </main>

    <footer>
        <div class="footer-grid">
            <p><span class="footer-label">Updated</span>November 24th, 2026</p>
            <p><span class="footer-label">Designer</span>Sean Lindholm</p>
            <p><span class="footer-label">Contact</span>seanlindholm101@gmail.com</p>
        </div>
    </footer>

    <script>
        const detailSlides = [
            { src: "Commission details/Request.PNG", alt: "Commission request" },
            { src: "Commission details/FullArtwork.PNG", alt: "Full commission artwork" },
            { src: "Commission details/Subject .PNG", alt: "Commission subject" },
            { src: "Commission details/Lineart.PNG", alt: "Commission line art" },
            { src: "Commission details/Sketch.PNG", alt: "Commission sketch" },
            { src: "Commission details/Restrictions.PNG", alt: "Commission restrictions" },
            { src: "Commission details/Contact.PNG", alt: "Commission contact information" }
        ];
        const detailImage = document.querySelector("#detail-slide");
        const detailCount = document.querySelector("#detail-count");
        let currentDetail = 0;

        function showDetailSlide(index) {
            currentDetail = (index + detailSlides.length) % detailSlides.length;
            const slide = detailSlides[currentDetail];
            detailImage.src = slide.src;
            detailImage.alt = slide.alt;
            detailCount.textContent = (currentDetail + 1) + " of " + detailSlides.length;
        }

        document.querySelector("#previous-detail").addEventListener("click", function () {
            showDetailSlide(currentDetail - 1);
        });
        document.querySelector("#next-detail").addEventListener("click", function () {
            showDetailSlide(currentDetail + 1);
        });
    </script>
</body>
</html>
